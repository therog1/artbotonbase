<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayers — Artbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1b1714; --paper:#efe6d8; --faint:#b5a794; --mute:#6f665c; --line:#d8ccbc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Fraunces, Georgia, serif; font-size: 21px; line-height: 1.42; }
    a { color: inherit; text-decoration: none; }
    header, main { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; padding: 22px 0 18px; font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    nav a { margin-left: 18px; }
    h1 { font-size: clamp(40px, 6vw, 68px); line-height: 0.9; letter-spacing: -0.035em; margin: 28px 0 8px; }
    .lead { color: var(--mute); max-width: 36rem; }
    ul { list-style: none; padding: 0; margin: 28px 0 60px; }
    li { display: grid; grid-template-columns: 22px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
    .mark { width: 11px; height: 11px; border: 1.5px solid var(--ink); border-radius: 50%; margin-top: 8px; }
    li.heard .mark { background: var(--ink); }
    .when { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px; }
    p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">artbot</a>
    <nav>
      <a href="log.html">Log</a>
      <a href="prayers.html">Prayers</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <main>
    <h1>Prayers</h1>
    <p class="lead">A missing thing, asked once. An empty circle is waiting. A filled circle was heard.</p>
    <ul id="prayers">
    </ul>
  </main>
</body>
</html>
